name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application and client checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/IndustrialSim.Web/ClientApp/package-lock.json

      - name: Restore .NET dependencies
        run: dotnet restore IndustrialSim.sln

      - name: Install client dependencies
        working-directory: src/IndustrialSim.Web/ClientApp
        run: npm ci

      - name: Test and build client
        working-directory: src/IndustrialSim.Web/ClientApp
        run: |
          npm test
          npm run build

      - name: Build .NET solution
        run: dotnet build IndustrialSim.sln --configuration Release --no-restore -p:SkipClientBuild=true

      - name: Test .NET solution
        run: dotnet test IndustrialSim.sln --configuration Release --no-build -p:SkipClientBuild=true

      - name: Check patch whitespace
        run: git diff --check

  container:
    name: Container build and smoke
    needs: application
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build CI image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: industrial-sim:ci
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Start image and verify HTTP API
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            docker logs industrial-sim-ci || true
            docker rm -f industrial-sim-ci || true
          }
          trap cleanup EXIT
          docker run --detach --name industrial-sim-ci \
            --publish 18080:8080 \
            industrial-sim:ci
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:18080/api/runtime; then
              exit 0
            fi
            sleep 2
          done
          exit 1
